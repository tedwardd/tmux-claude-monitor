name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch new tag
        run: git fetch --tags --force

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The published rule group names the Caskroom paths for this version, so it
      # has to be rendered after the tag is known and before goreleaser uploads.
      - name: Render Little Snitch rule group
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: go run . lsrules --release "$NEW_TAG" > claude-monitor.lsrules

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.new_tag }}
          # Pushing the cask needs write access to tedwardd/homebrew-tap, which the
          # built-in GITHUB_TOKEN cannot have: it is scoped to this repository only.
          # BREW_TAPPER is a PAT that carries exactly that cross-repo access.
          HOMEBREW_TAP_TOKEN: ${{ secrets.BREW_TAPPER }}
