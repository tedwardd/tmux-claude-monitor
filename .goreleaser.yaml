version: 2

project_name: claude-monitor

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: claude-monitor
    binaries:
      - claude-monitor
    repository:
      owner: tedwardd
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/tedwardd/tmux-claude-monitor
    description: tmux status bar daemon displaying Claude Pro quota usage in real time
    url:
      verified: github.com/tedwardd/tmux-claude-monitor/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/claude-monitor"]
            # An upgrade swaps the binary but leaves the running agent on the old one,
            # since nothing here manages launchd. Restart it when init has already
            # installed the agent, and stay quiet when it has not.
            label = "com.github.tedwardd.claude-monitor"
            if File.exist?(File.expand_path("~/Library/LaunchAgents/#{label}.plist"))
              system_command "/bin/launchctl",
                             args: ["kickstart", "-k", "gui/#{Process.uid}/#{label}"],
                             must_succeed: false
            end
          end
    caveats: |
      Run the one-time setup to install the launchd agent and patch your tmux config:

        claude-monitor init

      The daemon reads your Claude Code OAuth token from the login keychain.
      If macOS asks whether security can access it, choose "Always Allow".

      Little Snitch users can generate a rule group scoped to this install,
      covering every connection the daemon makes:

        claude-monitor lsrules > claude-monitor.lsrules && open claude-monitor.lsrules

checksum:
  name_template: checksums.txt

release:
  github:
    owner: tedwardd
    name: tmux-claude-monitor
